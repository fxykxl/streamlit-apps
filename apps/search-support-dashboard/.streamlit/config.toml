[theme]
base = "dark"
primaryColor = "#7c6cff"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#161d33"
textColor = "#e8ecf8"
linkColor = "#8b9dff"
borderColor = "#232c48"
dataframeBorderColor = "#1f2740"
dataframeHeaderBackgroundColor = "#141b2f"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseFontSize = 14
greenColor = "#34d399"
redColor = "#fb7185"
orangeColor = "#fb923c"
yellowColor = "#fbbf24"
blueColor = "#60a5fa"
violetColor = "#a78bfa"
chartCategoricalColors = ["#7c6cff", "#22d3ee", "#fbbf24", "#f472b6", "#34d399", "#fb923c", "#60a5fa", "#fb7185"]

[theme.sidebar]
backgroundColor = "#0d1224"
secondaryBackgroundColor = "#161d33"
borderColor = "#232c48"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
